  <text x="76" y="266" font-size="34" font-weight="700">One week.</text>
  <text x="76" y="301" font-size="34" font-weight="700" class="green">Make it count.</text>
  <text x="77" y="324" class="small muted">Build a campus movement for clean water. Rally your people and</text>
  <text x="77" y="341" class="small muted">make the most of your time, budget, and one week.</text>
