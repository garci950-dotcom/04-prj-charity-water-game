  <!-- Notes about essential controls and feedback -->
  <path d="M1078 824Q1314 821 1545 824" class="light"/>
  <text x="1078" y="856" class="tiny green">PLAYER FEEDBACK &amp; CONTROLS</text>
  <circle cx="1088" cy="883" r="4" fill="#c86c50"/>
  <text x="1102" y="887" class="small">First action starts the campaign; each day allows one move.</text>
  <circle cx="1088" cy="914" r="4" fill="#c86c50"/>
  <text x="1102" y="918" class="small">Confirm button is disabled until an action is selected.</text>
  <circle cx="1088" cy="945" r="4" fill="#c86c50"/>
  <text x="1102" y="949" class="small">A live toast reports gains, backfires, and event bonuses.</text>
  <circle cx="1088" cy="976" r="4" fill="#c86c50"/>
  <text x="1102" y="980" class="small">Final dialog: outcome message, score, stats, replay, close.</text>
  <circle cx="1088" cy="1007" r="4" fill="#c86c50"/>
  <text x="1102" y="1011" class="small">Restart icon starts a fresh campaign from the game screen.</text>

  <path d="M1078 1042Q1313 1039 1545 1043" class="light"/>
  <text x="1078" y="1072" class="small muted">Sketch key:  [yellow] primary action  ·  [green] progress  ·  [coral] risk / result</text>
  <path d="M74 1036Q375 1034 681 1038" class="light"/>
  <text x="78" y="1064" class="small muted">Flow: choose action → confirm turn → review feedback → repeat through Day 7 → replay.</text>
