<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">Campus Water Week game wireframe</title>
  <desc id="description">A hand-sketched desktop game screen with a seven-day campaign, today's event, campaign action cards, score and resources, alongside an alternate end-of-week results dialog.</desc>
  <defs>
    <pattern id="paper-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#c8c3b4"/>
    </pattern>
    <pattern id="progress" width="26" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="19" height="9" rx="4" fill="#e4e4d8" stroke="#73796f" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9" fill="none" stroke="#c86c50" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Comic Sans MS", "Segoe Print", cursive, sans-serif; fill: #26322d; }
      .ink { fill: none; stroke: #59635a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .light { fill: none; stroke: #a8aa9c; stroke-width: 1; stroke-linecap: round; }
      .rough { fill: none; stroke: #59635a; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
      .tiny { font-size: 11px; letter-spacing: 1.1px; font-weight: 700; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .heading { font-size: 22px; font-weight: 700; }
      .muted { fill: #70786f; }
      .green { fill: #286f59; }
      .coral { fill: #bd6149; }
      .yellow { fill: #f7da79; }
      .paper { fill: #fffdf6; }
      .box { fill: #fffdf6; stroke: #747a70; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="#f4f0e4"/>
  <rect width="1600" height="1160" fill="url(#paper-dots)" opacity=".62"/>
